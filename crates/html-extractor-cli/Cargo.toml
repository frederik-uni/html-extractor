[package]
name = "html-extractor-cli"
version.workspace = true
edition.workspace = true
description = "Command-line runner for HTML Extractor scripts."
license.workspace = true
documentation = "https://docs.rs/html-extractor-cli"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "html-extractor"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
html-extractor-core.workspace = true
html-extractor-runtime.workspace = true
is-terminal = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
